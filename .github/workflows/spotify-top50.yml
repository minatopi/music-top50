name: Update Spotify Top 50 Japan

on:
  schedule:
    # 毎日 09:00 JST
    # GitHub ActionsはUTC
    - cron: "0 0 * * *"

  # GitHub Actions画面から手動実行可能
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-top50
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape Spotify Top 50 Japan
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # --------------------------------------------------------
      # Repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # --------------------------------------------------------
      # Python packages
      # --------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------
      # Playwright
      # --------------------------------------------------------

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      # --------------------------------------------------------
      # Scrape
      # --------------------------------------------------------

      - name: Run Spotify scraper
        run: |
          python scrape.py

      # --------------------------------------------------------
      # Check result
      # --------------------------------------------------------

      - name: Show generated JSON
        run: |
          echo "Generated file:"
          ls -lh data/top50-japan.json

          echo ""
          echo "Track count:"
          python -c "import json; d=json.load(open('data/top50-japan.json')); print(len(d['tracks']))"

      # --------------------------------------------------------
      # Git
      # --------------------------------------------------------

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/top50-japan.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: update Spotify Top 50 Japan"

      - name: Push changes
        run: |
          git push
